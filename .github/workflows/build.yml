name: Build LockLyrics (.dylib)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 dylib with Theos
    runs-on: macos-latest

    env:
      THEOS: /Users/runner/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          if [ ! -d "$THEOS" ]; then
            git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          fi
          echo "Xcode path: $(xcode-select -p)"
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Build LockLyrics.dylib
        run: |
          make FINALPACKAGE=1

      - name: Verify binary architecture and zero jailbreak dependencies
        run: |
          DYLIB_PATH=".theos/obj/LockLyrics.dylib"
          if [ ! -f "$DYLIB_PATH" ]; then
            echo "Error: $DYLIB_PATH not found!"
            find .theos -maxdepth 4
            exit 1
          fi

          echo "=== Binary Info ==="
          file "$DYLIB_PATH"

          echo "=== Linked Libraries (otool -L) ==="
          otool -L "$DYLIB_PATH"

          if otool -L "$DYLIB_PATH" | grep -iE "CydiaSubstrate|ElleKit|libsubstrate|substitute"; then
            echo "ERROR: Jailbreak hook library dependency detected!"
            exit 1
          fi

          mkdir -p dist
          cp "$DYLIB_PATH" dist/LockLyrics.dylib

      - name: Upload LockLyrics.dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockLyrics-dylib
          path: dist/LockLyrics.dylib
          if-no-files-found: error
